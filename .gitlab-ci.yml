stages: [test, build, release]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Downloadable binaries live in the generic package registry under this name.
  PKG: quip-miner-cuda

default:
  # Same toolkit the Makefile targets use (Dockerfile.ci is this base with
  # rustup preinstalled): the CUDA 12.9 the crate's cuda-12090 pin targets.
  # A CUDA-less image cannot catch a pin/toolkit mismatch — the original
  # cuda-13020-vs-12.9-image gap shipped precisely because CI built on
  # rust:1.97. rust-toolchain.toml supplies the toolchain at first cargo use.
  image: nvidia/cuda:12.9.1-devel-ubuntu24.04
  tags: [linux, amd64]
  before_script:
    - apt-get update -qq && apt-get install -y -qq curl ca-certificates build-essential pkg-config protobuf-compiler git
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain none
    - export PATH="$HOME/.cargo/bin:$PATH"

cache:
  key: cargo-$CI_COMMIT_REF_SLUG
  paths: [.cargo/, target/]

test:
  stage: test
  script:
    - cargo fmt --all --check
    - cargo test --release
    # The support contract: every SUPPORTED_ARCHS entry NVRTC-compiles and
    # ptxas-assembles. Needs the toolkit (this image), not a GPU.
    - cargo test --release --test arch_coverage -- --include-ignored
    - cargo clippy --release --all-targets --all-features -- -D warnings
  # GPU-dependent tests stay `#[ignore]`d here, so this job reports them as
  # ignored rather than passed — "no GPU ran" is visible in the output. The
  # test-gpu job below (or `make test-gpu` locally) runs them on hardware.

# On-hardware suite. Manual + allow_failure until a runner carrying the `gpu`
# tag (docker executor with gpus=all) is confirmed; `make test-gpu` is the
# local equivalent and part of the release checklist.
test-gpu:
  stage: test
  tags: [gpu]
  when: manual
  allow_failure: true
  script:
    - cargo test --release -- --include-ignored

.build:
  stage: build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

build-amd64:
  extends: .build
  script:
    - cargo build --release --bins
    - mkdir -p dist
    - cp target/release/quip-cuda-sa dist/quip-cuda-sa-linux-amd64
    - cp target/release/quip-cuda-gibbs dist/quip-cuda-gibbs-linux-amd64

# On a tag: upload every built binary to the generic package registry, then cut
# a Release linking them as downloadable assets.
upload:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - |
      for f in dist/*; do
        n=$(basename "$f")
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}/${n}"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [upload]
  before_script: []
  script:
    - |
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}"
      release-cli create --name "quip-miner-cuda ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}" \
        --assets-link "{\"name\":\"quip-cuda-sa-linux-amd64\",\"url\":\"${base}/quip-cuda-sa-linux-amd64\"}" \
        --assets-link "{\"name\":\"quip-cuda-gibbs-linux-amd64\",\"url\":\"${base}/quip-cuda-gibbs-linux-amd64\"}"
