stages: [test, build, release]

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo
  # Downloadable binaries live in the generic package registry under this name.
  PKG: quip-miner-cuda

default:
  image: rust:1.97
  before_script:
    - apt-get update -qq && apt-get install -y -qq protobuf-compiler

cache:
  key: cargo-$CI_COMMIT_REF_SLUG
  paths: [.cargo/, target/]

test:
  stage: test
  script:
    - rustup component add clippy rustfmt
    - cargo fmt --all --check
    - cargo test --release
    - cargo clippy --release --all-targets --all-features -- -D warnings
  # GPU-dependent tests are `#[ignore]`d, so this job reports them as ignored
  # rather than passed — "no GPU ran" is visible in the output instead of
  # looking identical to a green run. On a runner with a CUDA device, run them
  # explicitly with `cargo test --release -- --include-ignored`.

.build:
  stage: build
  artifacts:
    paths: [dist/]
    expire_in: 1 week

build-amd64:
  extends: .build
  script:
    - cargo build --release --bins
    - mkdir -p dist
    - cp target/release/quip-cuda-sa dist/quip-cuda-sa-amd64
    - cp target/release/quip-cuda-gibbs dist/quip-cuda-gibbs-amd64

# On a tag: upload every built binary to the generic package registry, then cut
# a Release linking them as downloadable assets.
upload:
  stage: release
  image: curlimages/curl:latest
  rules:
    - if: $CI_COMMIT_TAG
  before_script: []
  script:
    - |
      for f in dist/*; do
        n=$(basename "$f")
        curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$f" \
          "${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}/${n}"
      done

release:
  stage: release
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
  needs: [upload]
  before_script: []
  script:
    - |
      base="${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/generic/${PKG}/${CI_COMMIT_TAG}"
      release-cli create --name "quip-miner-cuda ${CI_COMMIT_TAG}" --tag-name "${CI_COMMIT_TAG}" \
        --assets-link "{\"name\":\"quip-cuda-sa-amd64\",\"url\":\"${base}/quip-cuda-sa-amd64\"}" \
        --assets-link "{\"name\":\"quip-cuda-gibbs-amd64\",\"url\":\"${base}/quip-cuda-gibbs-amd64\"}"
